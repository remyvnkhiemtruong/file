<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Nhận phiếu tài khoản HCMUE</title>
</head>
<body>
  <main><p>Đang mở <a id="account" href="https://script.google.com/macros/s/AKfycbzqynIlNFsoqBa_nnTNvSyYPKdHvSmKlqSvtPrnxg375B7ReZmKEGWSMKwJUgPGgy5cew/exec?page=account">trang nhận phiếu tài khoản HCMUE</a>…</p></main>
  <script>
    const link = document.getElementById('account');
    const params = new URLSearchParams(location.hash.slice(1));
    const claim = params.get('claim');
    const id = params.get('mssv');
    if (/^[0-9a-f]{32}$/.test(claim || '')) {
      link.hash = 'claim=' + claim + (/^[0-9]{10}$/.test(id || '') ? '&mssv=' + id : '');
    }
    location.replace(link.href);
  </script>
</body>
</html>
